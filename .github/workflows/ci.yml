name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: campus_user
          POSTGRES_PASSWORD: campus_secure_password
          POSTGRES_DB: campus_lost_and_found
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Lint
        run: |
          cd backend
          ruff check .

      - name: Run Mypy Typecheck
        run: |
          cd backend
          mypy .

      - name: Run Alembic Check
        env:
          DATABASE_URL: postgresql+asyncpg://campus_user:campus_secure_password@localhost:5432/campus_lost_and_found
          SYNC_DATABASE_URL: postgresql+psycopg://campus_user:campus_secure_password@localhost:5432/campus_lost_and_found
        run: |
          cd backend
          alembic upgrade head
          alembic check

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://campus_user:campus_secure_password@localhost:5432/campus_lost_and_found
          SYNC_DATABASE_URL: postgresql+psycopg://campus_user:campus_secure_password@localhost:5432/campus_lost_and_found
        run: |
          cd backend
          pytest -v

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Lint & Typecheck
        run: |
          cd frontend
          npm run lint
          npx tsc --noEmit

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
