# Plain-HTTP server for this machine only.
# docker-compose.yml publishes it on 127.0.0.1:8080, so every request here comes from the local
# machine. That is what lets the backend accept logins over plain HTTP from it (SEC7, AC-07);
# other devices must use the HTTPS server (nginx/tls.conf, docker-compose.lan.yml).
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    set $client_network loopback;
    set $hsts "";  # HSTS only over HTTPS (nginx omits a header whose value is empty)
    include /etc/nginx/snippets/app-locations.conf;
}
