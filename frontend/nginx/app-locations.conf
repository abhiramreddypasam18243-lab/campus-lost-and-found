# Shared by the plain-HTTP server (nginx.conf) and the HTTPS server (nginx/tls.conf).
# Each server sets $client_network before including this file.

# Photos may be up to 5 MB (spec 5.7); the API enforces 1 MB for other bodies (AC-15).
client_max_body_size 6m;

# Security headers (SEC9, AC-13) are set per location: nginx drops inherited add_header lines
# in any location that declares its own. Same-origin only: no third-party scripts, styles or
# fonts; 'unsafe-inline' styles cover React style attributes only. API responses carry the
# backend's own security headers, so /api/ adds none.

location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Set by this proxy, overwriting anything the client sent (SEC7). The backend trusts these
    # two headers only from the configured proxy address.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Client-Network $client_network;
}

# The app shell must never be cached, so a rebuild is picked up immediately.
location = /index.html {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security $hsts always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
}

# Hashed assets are immutable.
location /assets/ {
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security $hsts always;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location / {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security $hsts always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
}
