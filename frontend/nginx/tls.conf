# HTTPS for other devices on the network (D7, AC-142). Enabled by docker-compose.lan.yml, which
# mounts this file and the certificate made with mkcert (see README, "Using it from a phone").
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/campus.pem;
    ssl_certificate_key /etc/nginx/certs/campus-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    set $hsts "max-age=31536000";

    root /usr/share/nginx/html;
    index index.html;

    set $client_network lan;
    include /etc/nginx/snippets/app-locations.conf;
}
