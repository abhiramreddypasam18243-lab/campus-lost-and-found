services:
  - type: web
    name: campus-lost-and-found
    env: docker
    dockerfilePath: Dockerfile.web
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: EMBEDDING_BACKEND
        value: standin
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campus-db
          property: connectionString
      - key: ALLOWED_EMAIL_DOMAINS
        value: "campus.edu,student.campus.edu,iisc.ac.in,edu.in,ac.in"

databases:
  - name: campus-db
    databaseName: campus_lost_and_found
    user: campus_user
    plan: free
